<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<style>
  :root {
    --bg: #FAF9F5;
    --fg: #141413;
    --muted: #87867F;
    --accent: #D97757;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--fg);
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 6vw;
  }
  .slide-inner { width: 100%; max-width: 780px; }
  .slide.invert { background: var(--fg); color: var(--bg); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6vw, 64px); line-height: 1.08; margin-bottom: 20px; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; margin-bottom: 32px; }
  p { font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 580px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  #counter { position: fixed; bottom: 22px; right: 28px; font-family: var(--mono); font-size: 12px; color: var(--muted); user-select: none; z-index: 10; }
</style>
</head>
<body>

  <section class="slide" id="s1">
    <div class="slide-inner">
      <h1>Title goes here</h1>
      <p>One-sentence subtitle that sets context.</p>
    </div>
  </section>

  <section class="slide" id="s2">
    <div class="slide-inner">
      <div class="eyebrow">Section 1</div>
      <h2>Main point</h2>
      <p>Supporting detail in a single readable paragraph.</p>
    </div>
  </section>

  <section class="slide invert" id="s3">
    <div class="slide-inner">
      <div class="eyebrow">Section 2</div>
      <h2>Key takeaway</h2>
      <p>Inverted slide for emphasis.</p>
    </div>
  </section>

  <div id="counter">1 / 3</div>

<script>
  (function () {
    const slides = Array.from(document.querySelectorAll('.slide'));
    const counter = document.getElementById('counter');
    let current = 0;

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')                     { e.preventDefault(); go(current - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          current = slides.indexOf(en.target);
          counter.textContent = (current + 1) + ' / ' + slides.length;
        }
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>

</body>
</html>
